<body class="text-slate-800 bg-pattern min-h-screen flex flex-col pb-12">

    <!-- TAHAP 1: SCREEN LOGIN & AUTENTIKASI AWAL (PERBAIKAN KEAMANAN PASSWORDS) -->
    <section id="loginScreen" class="min-h-screen flex items-center justify-center p-4 z-50">
        <div class="glass-card bg-white/95 rounded-3xl max-w-md w-full p-8 shadow-2xl border border-ocean-100 space-y-6">
            
            <div class="text-center space-y-2">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-ocean-950 to-ocean-800 border-2 border-ocean-300 flex items-center justify-center text-amber-300 text-3xl font-bold mx-auto shadow-xl shadow-ocean-900/20">
                    <i class="fa-solid fa-moon"></i>
                </div>
                <h1 class="text-2xl font-extrabold tracking-wide text-ocean-950 flex items-center justify-center gap-2">
                    <span>TAZKIYA</span>
                    <span class="text-xs bg-ocean-100 text-ocean-800 font-semibold px-2.5 py-0.5 rounded-full border border-ocean-200">Planner</span>
                </h1>
                <p class="text-xs text-slate-500" id="loginSubtitle">Masuk dengan Akun Terdaftar</p>
            </div>

            <!-- Notice / Alert Banner untuk Feedback Login & Register -->
            <div id="authNoticeBox" class="hidden p-3 rounded-xl text-xs font-semibold flex items-center gap-2">
                <i id="authNoticeIcon" class="fa-solid"></i>
                <span id="authNoticeText"></span>
            </div>

            <form id="initialAuthForm" onsubmit="handleInitialAuth(event)" class="space-y-3.5 pt-2">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Alamat Email</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
                        <input type="email" id="initEmailInput" required placeholder="nama@domain.com" class="w-full text-xs pl-9 pr-3 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-ocean-600 focus:border-transparent bg-slate-50/50">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Kata Sandi</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
                        <input type="password" id="initPasswordInput" required placeholder="••••••••" class="w-full text-xs pl-9 pr-3 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-ocean-600 focus:border-transparent bg-slate-50/50">
                    </div>
                </div>

                <button type="submit" id="initAuthBtn" class="w-full bg-gradient-to-r from-ocean-800 to-ocean-900 hover:from-ocean-900 hover:to-ocean-950 text-white font-bold text-xs py-3.5 rounded-xl transition shadow-lg shadow-ocean-900/20 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket" id="initAuthBtnIcon"></i>
                    <span id="initAuthBtnText">Masuk ke Aplikasi</span>
                </button>
            </form>

            <div class="flex items-center justify-between">
                <span class="border-b border-slate-200 w-full"></span>
                <span class="text-[10px] text-slate-400 uppercase px-3 font-semibold whitespace-nowrap">atau opsi lain</span>
                <span class="border-b border-slate-200 w-full"></span>
            </div>

            <div class="space-y-2.5">
                <button onclick="document.getElementById('openGdriveModal').click();" class="w-full bg-slate-50 hover:bg-slate-100 text-slate-700 font-semibold text-xs py-3 rounded-xl border border-slate-200 transition flex items-center justify-center gap-2 shadow-sm">
                    <i class="fa-brands fa-google-drive text-ocean-600 text-sm"></i>
                    <span>Masuk via Google Drive Sync</span>
                </button>
            </div>

    <script>
        const DOSA_ANGGOTA_TUBUH = [
            {
                id: 'mata',
                title: 'Dosa Mata',
                icon: 'fa-eye',
                items: [
                    { id: 'm1', label: 'Melihat konten pornografi / aurat bukan mahram' },
                    { id: 'm2', label: 'Pandangan meremehkan / sinis kepada orang lain' },
                    { id: 'm3', label: 'Melihat keburukan / aib saudara muslim' },
                    { id: 'm4', label: 'Mata tidak dihalangi dari gambar/video haram di medsos' }
                ]
            },
            {
                id: 'telinga',
                title: 'Dosa Telinga',
                icon: 'fa-ear-listen',
                items: [
                    { id: 't1', label: 'Mendengarkan ghibah / gosip menceritakan aib orang' },
                    { id: 't2', label: 'Mendengarkan musik/audio yang melalaikan dari ingat Allah' },
                    { id: 't3', label: 'Mencuri dengar (mengintip pembicaraan rahasia orang)' }
                ]
            },
            {
                id: 'lisan',
                title: 'Dosa Lisan',
                icon: 'fa-comment-slash',
                items: [
                    { id: 'l1', label: 'Berbohong / berdusta meskipun bercanda' },
                    { id: 'l2', label: 'Ghibah (membicarakan keburukan orang lain)' },
                    { id: 'l3', label: 'Mengeluarkan perkataan kasar, kotor, atau memaki' },
                    { id: 'l4', label: 'Mengingkari janji yang telah disepakati' },
                    { id: 'l5', label: 'Perkataan sia-sia tanpa guna (laghw)' }
                ]
            },
            {
                id: 'pikiran',
                title: 'Dosa Pikiran & Hati',
                icon: 'fa-brain',
                items: [
                    { id: 'p1', label: 'Riya\' / Ingin dipuji orang lain dalam beribadah' },
                    { id: 'p2', label: 'Hasad / Dengki atas nikmat yang diperoleh orang lain' },
                    { id: 'p3', label: 'Su\'udzon / Berburuk sangka tanpa bukti' },
                    { id: 'p4', label: 'Takabbur / Merasa diri lebih mulia dari orang lain' }
                ]
            },
            {
                id: 'tangan',
                title: 'Dosa Tangan',
                icon: 'fa-hand',
                items: [
                    { id: 'tn1', label: 'Mengetik komentar jahat, toxic, atau fitnah di internet' },
                    { id: 'tn2', label: 'Mengambil/menggunakan barang yang bukan haknya' },
                    { id: 'tn3', label: 'Menyakiti atau memukul secara dhalim' }
                ]
            },
            {
                id: 'kemaluan',
                title: 'Dosa Kemaluan',
                icon: 'fa-user-shield',
                items: [
                    { id: 'k1', label: 'Mendekati zina (fathanah/kencan tak syar\'i/khalwat)' },
                    { id: 'k2', label: 'Menonton atau mengonsumsi hal-hal yang membangkitkan syahwat haram' }
                ]
            },
            {
                id: 'kaki',
                title: 'Dosa Kaki',
                icon: 'fa-shoe-prints',
                items: [
                    { id: 'kk1', label: 'Melangkahkan kaki ke tempat yang dimurkai Allah (tempat maksiat)' },
                    { id: 'kk2', label: 'Berjalan dengan sombong / angkuh di muka bumi' }
                ]
            }
        ];

        const DEFAULT_AMAL_SHOLEH = [
            { id: 'a1', label: 'Shalat Berjamaah / Tepat Waktu', category: 'Ibadah' },
            { id: 'a2', label: 'Membaca Al-Qur\'an (Minimal 1 Juz / 1 Maqra)', category: 'Ibadah' },
            { id: 'a3', label: 'Shalat Sunnah Rawatib / Dhuha / Tahajud', category: 'Ibadah' },
            { id: 'a4', label: 'Sedekah Subuh / Kebaikan Harian', category: 'Sosial' },
            { id: 'a5', label: 'Membaca Dzikir Pagi & Petang', category: 'Ibadah' },
            { id: 'a6', label: 'Menuntut Ilmu Agama (Kajian / Buku Syar\'i)', category: 'Ilmu' }
        ];

        const PRAYER_LIST = [
            { id: 'subuh', name: 'Subuh', icon: 'fa-sun' },
            { id: 'dzuhur', name: 'Dzuhur', icon: 'fa-sun' },
            { id: 'ashar', name: 'Ashar', icon: 'fa-sun-plant-wilt' },
            { id: 'maghrib', name: 'Maghrib', icon: 'fa-moon' },
            { id: 'isya', name: 'Isya', icon: 'fa-star' }
        ];

        const DZIKIR_DATA = {
            istighfar: { text: 'أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ', target: 100 },
            subhanallah: { text: 'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ', target: 100 },
            sholawat: { text: 'اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ', target: 100 },
            hauqolah: { text: 'لا حَوْلَ وَلا قُوَّةَ إِلا بِاللَّهِ', target: 100 },
            tahlil: { text: 'لا إِلَهَ إِلا اللَّهُ', target: 100 }
        };

        const QUOTES_ULAMA = [
            { quote: "Sesungguhnya dunia ini pergi menjauh, dan akhirat datang mendekat. Masing-masing memiliki anak-anak. Jadilah anak-anak akhirat dan jangan jadi anak-anak dunia! Karena hari ini adalah beramal tanpa hisab, sedangkan besok adalah hisab tanpa amal.", author: "Ali bin Abi Thalib radhiyallahu 'anhu", category: "Hisab & Akhirat" },
            { quote: "Wahai manusia, sesungguhnya engkau hanyalah kumpulan hari-hari. Setiap kali berlalu satu hari, maka berkuranglah sebagian dari dirimu.", author: "Hasan Al-Basri rahimahullah", category: "Umur Singkat" },
            { quote: "Barangsiapa yang harinya sama dengan kemarin, maka ia rugi. Barangsiapa yang harinya lebih buruk dari kemarin, maka ia terlaknat.", author: "Nasihat Salafush Shalih", category: "Evaluasi Diri" },
            { quote: "Dunia itu hanya tiga hari: Kemarin yang telah berlalu dan takkan kembali, Besok yang belum tentu engkau dapati, dan Hari ini tempat engkau beramal, maka manfaatkanlah!", author: "Imam Al-Ghazali rahimahullah", category: "Waktu" }
        ];

        let currentDateStr = new Date().toISOString().split('T')[0];
        let appData = loadAppData();
        let currentQuoteIndex = 0;
        let sinChartInstance = null;
        let isInitRegister = false;

        function loadAppData() {
            const stored = localStorage.getItem('tazkiya_app_data');
            if (stored) {
                try {
                    return JSON.parse(stored);
                } catch (e) {
                    console.error('Error parsing stored data', e);
                }
            }
            return {
                currentUserEmail: '',
                registeredUsers: {}, // Menyimpan email & password terenkripsi: { 'email': 'password' }
                customAmal: [],
                gdriveClientId: '',
                dates: {}
            };
        }

        function saveData() {
            localStorage.setItem('tazkiya_app_data', JSON.stringify(appData));
            updateDashboardIndexes();
        }

        function getTodayData() {
            if (!appData.dates[currentDateStr]) {
                appData.dates[currentDateStr] = {
                    dosaChecked: {},
                    amalChecked: {},
                    shalatChecked: {},
                    dzikirCounts: { istighfar: 0, subhanallah: 0, sholawat: 0, hauqolah: 0, tahlil: 0 }
                };
            }
            return appData.dates[currentDateStr];
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active-tab', 'text-amber-300', 'bg-ocean-800/80');
                btn.classList.add('text-ocean-200');
            });

            const activeContent = document.getElementById(tabId);
            if (activeContent) activeContent.classList.remove('hidden');

            const activeBtn = document.querySelector(`[data-tab="${tabId}"]`);
            if (activeBtn) {
                activeBtn.classList.add('active-tab', 'text-amber-300', 'bg-ocean-800/80');
                activeBtn.classList.remove('text-ocean-200');
            }
        }

        function renderMuhasabahDosa() {
            const container = document.getElementById('muhasabahContainer');
            if (!container) return;

            // Simpan status accordion yang terbuka sebelum re-render
            const openAccordionIds = new Set();
            document.querySelectorAll('[id^="group-"]').forEach(el => {
                if (!el.classList.contains('hidden')) {
                    openAccordionIds.add(el.id.replace('group-', ''));
                }
            });

            container.innerHTML = '';
            const today = getTodayData();

            DOSA_ANGGOTA_TUBUH.forEach(group => {
                const groupEl = document.createElement('div');
                groupEl.className = 'border border-slate-200/80 rounded-xl overflow-hidden bg-white';

                let totalItems = group.items.length;
                let terjagaCount = 0;
                group.items.forEach(item => {
                    if (today.dosaChecked[item.id]) {
                        terjagaCount++;
                    }
                });

                const isAllTerjaga = totalItems > 0 && terjagaCount === totalItems;
                const isOpen = openAccordionIds.has(group.id);

                groupEl.innerHTML = `
                    <button class="w-full p-3.5 text-left flex items-center justify-between bg-slate-50/70 hover:bg-slate-100/70 transition toggle-accordion" data-target="${group.id}">
                        <div class="flex items-center space-x-3">
                            <div class="w-8 h-8 rounded-lg ${isAllTerjaga ? 'bg-ocean-100 text-ocean-800' : 'bg-slate-200 text-slate-700'} flex items-center justify-center text-sm">
                                <i class="fa-solid ${group.icon}"></i>
                            </div>
                            <div>
                                <h3 class="text-sm font-bold text-slate-800">${group.title}</h3>
                                <p class="text-[11px] text-slate-500">${terjagaCount}/${totalItems} Terjaga dari Hilaf</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${isAllTerjaga ? 'bg-ocean-100 text-ocean-800' : 'bg-amber-100 text-amber-800'}">
                                ${isAllTerjaga ? 'Bersih' : 'Perlu Dijaga'}
                            </span>
                            <i class="fa-solid fa-chevron-down text-xs text-slate-400 transition-transform transform ${isOpen ? 'rotate-180' : ''}"></i>
                        </div>
                    </button>
                    
                    <div id="group-${group.id}" class="${isOpen ? '' : 'hidden'} p-3 border-t border-slate-100 space-y-2 bg-white">
                        ${group.items.map(item => {
                            const isChecked = !!today.dosaChecked[item.id];
                            return `
                                <label class="flex items-start space-x-3 p-2 rounded-lg hover:bg-slate-50 cursor-pointer text-xs">
                                    <input type="checkbox" class="dosa-checkbox mt-0.5 rounded text-ocean-600 focus:ring-ocean-500 w-4 h-4 cursor-pointer" data-id="${item.id}" ${isChecked ? 'checked' : ''}>
                                    <span class="${isChecked ? 'text-slate-800 font-medium' : 'text-slate-600'} leading-relaxed">
                                        ${item.label}
                                    </span>
                                </label>
                            `;
                        }).join('')}
                    </div>
                `;

                container.appendChild(groupEl);
            });

            document.querySelectorAll('.toggle-accordion').forEach(btn => {
                btn.addEventListener('click', () => {
                    const targetId = btn.getAttribute('data-target');
                    const targetEl = document.getElementById(`group-${targetId}`);
                    const icon = btn.querySelector('.fa-chevron-down');
                    
                    if (targetEl.classList.contains('hidden')) {
                        targetEl.classList.remove('hidden');
                        icon?.classList.add('rotate-180');
                    } else {
                        targetEl.classList.add('hidden');
                        icon?.classList.remove('rotate-180');
                    }
                });
            });

            document.querySelectorAll('.dosa-checkbox').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const id = e.target.getAttribute('data-id');
                    today.dosaChecked[id] = e.target.checked;
                    saveData();
                    renderMuhasabahDosa();
                });
            });
        }

        function renderAmalSholeh() {
            const container = document.getElementById('amalSholehContainer');
            if (!container) return;
            container.innerHTML = '';

            const today = getTodayData();
            const allAmal = [...DEFAULT_AMAL_SHOLEH, ...appData.customAmal];

            allAmal.forEach(amal => {
                const isChecked = !!today.amalChecked[amal.id];
                const itemEl = document.createElement('div');
                itemEl.className = `p-3 rounded-xl border transition flex items-center justify-between ${isChecked ? 'bg-ocean-50/60 border-ocean-200' : 'bg-white border-slate-200/80'}`;

                itemEl.innerHTML = `
                    <label class="flex items-center space-x-3 cursor-pointer w-full">
                        <input type="checkbox" class="amal-checkbox rounded text-ocean-600 focus:ring-ocean-500 w-4 h-4 cursor-pointer" data-id="${amal.id}" ${isChecked ? 'checked' : ''}>
                        <div class="flex-grow">
                            <span class="text-xs font-semibold ${isChecked ? 'text-ocean-900 line-through' : 'text-slate-800'}">
                                ${amal.label}
                            </span>
                            <span class="ml-2 text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full">
                                ${amal.category}
                            </span>
                        </div>
                    </label>
                `;

                container.appendChild(itemEl);
            });

            document.querySelectorAll('.amal-checkbox').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const id = e.target.getAttribute('data-id');
                    today.amalChecked[id] = e.target.checked;
                    saveData();
                    renderAmalSholeh();
                });
            });
        }

        function renderShalatTracker() {
            const container = document.getElementById('prayerContainer');
            if (!container) return;
            container.innerHTML = '';

            const today = getTodayData();

            PRAYER_LIST.forEach(prayer => {
                const isChecked = !!today.shalatChecked[prayer.id];
                const itemEl = document.createElement('div');
                itemEl.className = `flex items-center justify-between p-2.5 rounded-xl border ${isChecked ? 'bg-ocean-50/80 border-ocean-200' : 'bg-slate-50/50 border-slate-200/60'}`;

                itemEl.innerHTML = `
                    <div class="flex items-center space-x-2.5">
                        <div class="w-7 h-7 rounded-lg ${isChecked ? 'bg-ocean-600 text-white' : 'bg-slate-200 text-slate-600'} flex items-center justify-center text-xs">
                            <i class="fa-solid ${prayer.icon}"></i>
                        </div>
                        <span class="text-xs font-bold text-slate-800">${prayer.name}</span>
                    </div>
                    <input type="checkbox" class="shalat-checkbox rounded text-ocean-600 focus:ring-ocean-500 w-4 h-4 cursor-pointer" data-id="${prayer.id}" ${isChecked ? 'checked' : ''}>
                `;

                container.appendChild(itemEl);
            });

            document.querySelectorAll('.shalat-checkbox').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const id = e.target.getAttribute('data-id');
                    today.shalatChecked[id] = e.target.checked;
                    saveData();
                    renderShalatTracker();
                });
            });
        }

        function renderQuote() {
            const quote = QUOTES_ULAMA[currentQuoteIndex];
            const qText = document.getElementById('quoteText');
            const qAuthor = document.getElementById('quoteAuthor');
            const qCategory = document.getElementById('quoteCategory');
            if (qText) qText.innerText = `"${quote.quote}"`;
            if (qAuthor) qAuthor.innerText = `— ${quote.author}`;
            if (qCategory) qCategory.innerText = quote.category;
        }

        function updateDashboardIndexes() {
            const today = getTodayData();

            let totalDosaItems = 0;
            let terjagaCount = 0;
            DOSA_ANGGOTA_TUBUH.forEach(g => {
                g.items.forEach(i => {
                    totalDosaItems++;
                    if (today.dosaChecked[i.id]) terjagaCount++;
                });
            });
            const dosaPct = Math.round((terjagaCount / totalDosaItems) * 100);
            const dosaIndexEl = document.getElementById('summaryDosaIndex');
            if (dosaIndexEl) dosaIndexEl.innerText = `${dosaPct}%`;

            renderSinChart(today, totalDosaItems, terjagaCount);

            const allAmal = [...DEFAULT_AMAL_SHOLEH, ...appData.customAmal];
            let doneAmal = 0;
            allAmal.forEach(a => {
                if (today.amalChecked[a.id]) doneAmal++;
            });
            const amalPct = allAmal.length > 0 ? Math.round((doneAmal / allAmal.length) * 100) : 0;
            const amalIndexEl = document.getElementById('summaryAmalIndex');
            if (amalIndexEl) amalIndexEl.innerText = `${amalPct}%`;

            let shalatDone = 0;
            PRAYER_LIST.forEach(p => {
                if (today.shalatChecked[p.id]) shalatDone++;
            });
            const shalatCountEl = document.getElementById('summaryShalatCount');
            if (shalatCountEl) shalatCountEl.innerText = `${shalatDone}/5`;
        }

        function renderSinChart(today, totalDosaItems, totalTerjagaCount) {
            const chartCanvas = document.getElementById('sinDistributionChart');
            const metricsContainer = document.getElementById('chartMetricsContainer');
            if (!chartCanvas || !metricsContainer) return;

            const labels = [];
            const sinCounts = [];
            const backgroundColors = [
                '#0284c7', '#0369a1', '#f59e0b', '#8b5cf6', 
                '#ec4899', '#ef4444', '#14b8a6'
            ];

            metricsContainer.innerHTML = '';
            let totalSinsCommitted = 0;

            DOSA_ANGGOTA_TUBUH.forEach((group) => {
                labels.push(group.title);
                let unguardedCount = 0;
                group.items.forEach(item => {
                    if (!today.dosaChecked[item.id]) {
                        unguardedCount++;
                    }
                });
                sinCounts.push(unguardedCount);
                totalSinsCommitted += unguardedCount;

                const isClean = unguardedCount === 0;
                const metricPill = document.createElement('div');
                metricPill.className = `p-2 rounded-lg border flex items-center justify-between ${isClean ? 'bg-ocean-50/70 border-ocean-200 text-ocean-900' : 'bg-red-50/70 border-red-200 text-red-900'}`;
                metricPill.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid ${group.icon} text-xs"></i>
                        <span class="font-semibold text-[11px]">${group.title}</span>
                    </div>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${isClean ? 'bg-ocean-200/60 text-ocean-800' : 'bg-red-200/60 text-red-800'}">
                        ${isClean ? 'Terjaga' : unguardedCount + ' Khilaf'}
                    </span>
                `;
                metricsContainer.appendChild(metricPill);
            });

            const purityPct = Math.round((totalTerjagaCount / totalDosaItems) * 100);
            const badgeEl = document.getElementById('purityStatusBadge');
            if (badgeEl) {
                badgeEl.innerText = `Tingkat Perjagaan: ${purityPct}% (${purityPct >= 80 ? 'Sangat Baik' : purityPct >= 50 ? 'Cukup Waspada' : 'Perlu Taubat'})`;
                badgeEl.className = `text-xs font-bold px-3 py-1 rounded-full border ${
                    purityPct >= 80 ? 'bg-ocean-100 text-ocean-800 border-ocean-200' : 
                    purityPct >= 50 ? 'bg-amber-100 text-amber-800 border-amber-200' : 
                    'bg-red-100 text-red-800 border-red-200'
                }`;
            }

            const ctx = chartCanvas.getContext('2d');
            const chartDataValues = totalSinsCommitted === 0 ? [1] : sinCounts;
            const chartLabels = totalSinsCommitted === 0 ? ['Bersih Sepenuhnya'] : labels;
            const chartColors = totalSinsCommitted === 0 ? ['#0284c7'] : backgroundColors;

            if (sinChartInstance) {
                sinChartInstance.data.labels = chartLabels;
                sinChartInstance.data.datasets[0].data = chartDataValues;
                sinChartInstance.data.datasets[0].backgroundColor = chartColors;
                sinChartInstance.update();
            } else {
                sinChartInstance = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: chartLabels,
                        datasets: [{
                            data: chartDataValues,
                            backgroundColor: chartColors,
                            borderWidth: 2,
                            borderColor: '#ffffff'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        if (totalSinsCommitted === 0) {
                                            return ' Alhamdulillah, semua 7 anggota tubuh terjaga';
                                        }
                                        return ` ${context.label}: ${context.raw} catatan khilaf`;
                                    }
                                }
                            }
                        },
                        cutout: '68%'
                    }
                });
            }
        }

        function updateDzikirUI() {
            const selectEl = document.getElementById('dzikirSelect');
            if (!selectEl) return;
            const selectedKey = selectEl.value;
            const data = DZIKIR_DATA[selectedKey];
            const today = getTodayData();

            const arabicEl = document.getElementById('dzikirArabicText');
            const targetEl = document.getElementById('dzikirTargetDisplay');
            const counterEl = document.getElementById('dzikirCounterDisplay');

            if (arabicEl) arabicEl.innerText = data.text;
            if (targetEl) targetEl.innerText = data.target;

            const currentCount = today.dzikirCounts[selectedKey] || 0;
            if (counterEl) counterEl.innerText = currentCount;
        }

        function showAuthNotice(message, isError = true) {
            const box = document.getElementById('authNoticeBox');
            const text = document.getElementById('authNoticeText');
            const icon = document.getElementById('authNoticeIcon');
            if (!box || !text || !icon) return;

            box.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'border-red-200', 'bg-emerald-50', 'text-emerald-700', 'border-emerald-200');
            icon.classList.remove('fa-circle-xmark', 'fa-circle-check');

            if (isError) {
                box.classList.add('bg-red-50', 'text-red-700', 'border', 'border-red-200');
                icon.classList.add('fa-circle-xmark');
            } else {
                box.classList.add('bg-emerald-50', 'text-emerald-700', 'border', 'border-emerald-200');
                icon.classList.add('fa-circle-check');
            }

            text.innerText = message;
        }

        function hideAuthNotice() {
            const box = document.getElementById('authNoticeBox');
            if (box) box.classList.add('hidden');
        }

        function toggleInitAuthMode() {
            isInitRegister = !isInitRegister;
            hideAuthNotice();
            const btnText = document.getElementById('initAuthBtnText');
            const btnIcon = document.getElementById('initAuthBtnIcon');
            const toggleText = document.getElementById('toggleInitAuthText');
            const promptText = document.getElementById('authPromptText');
            const subtitle = document.getElementById('loginSubtitle');

            if (isInitRegister) {
                if (btnText) btnText.innerText = 'Buat Akun Sekarang';
                if (btnIcon) btnIcon.className = 'fa-solid fa-user-plus';
                if (toggleText) toggleText.innerText = 'Masuk Saja';
                if (promptText) promptText.innerText = 'Sudah memiliki akun?';
                if (subtitle) subtitle.innerText = 'Buat Akun Baru Tazkiya';
            } else {
                if (btnText) btnText.innerText = 'Masuk ke Aplikasi';
                if (btnIcon) btnIcon.className = 'fa-solid fa-right-to-bracket';
                if (toggleText) toggleText.innerText = 'Daftar Akun Baru';
                if (promptText) promptText.innerText = 'Belum punya akun?';
                if (subtitle) subtitle.innerText = 'Masuk dengan Akun Terdaftar';
            }
        }

        function handleInitialAuth(e) {
            e.preventDefault();
            hideAuthNotice();

            const emailInput = document.getElementById('initEmailInput');
            const passInput = document.getElementById('initPasswordInput');
            
            const email = emailInput ? emailInput.value.trim().toLowerCase() : '';
            const password = passInput ? passInput.value.trim() : '';

            if (!email || !password) {
                showAuthNotice('Silakan isi email dan kata sandi dengan lengkap.');
                return;
            }

            if (!appData.registeredUsers) {
                appData.registeredUsers = {};
            }

            if (isInitRegister) {
                // Proses Pendaftaran Akun Baru
                if (appData.registeredUsers[email]) {
                    showAuthNotice('Email ini sudah terdaftar! Silakan pilih "Masuk Saja".');
                    return;
                }
                if (password.length < 4) {
                    showAuthNotice('Kata sandi minimal 4 karakter.');
                    return;
                }

                // Simpan Akun Baru dengan enkripsi kata sandi
                appData.registeredUsers[email] = btoa(password);
                appData.currentUserEmail = email;
                saveData();
                showAuthNotice('Pendaftaran berhasil! Mengalihkan...', false);
                setTimeout(() => showMainApp(email), 800);
            } else {
                // Proses Login Validasi Kata Sandi Ketat
                const storedEncryptedPass = appData.registeredUsers[email];

                if (!storedEncryptedPass) {
                    // Reset sesi aktif jika ada sisa data lama
                    appData.currentUserEmail = '';
                    saveData();
                    showAuthNotice('Email belum terdaftar. Silakan klik "Daftar Akun Baru" terlebih dahulu.');
                    return;
                }

                // Verifikasi kata sandi yang diketikkan pengguna
                if (atob(storedEncryptedPass) !== password) {
                    // Reset sesi aktif agar tidak bisa lolos login
                    appData.currentUserEmail = '';
                    saveData();
                    showAuthNotice('Kata sandi salah! Masukkan kata sandi yang benar.');
                    return;
                }

                // Login Berhasil jika Kata Sandi Benar 100%
                appData.currentUserEmail = email;
                saveData();
                showAuthNotice('Berhasil masuk! Mengalihkan...', false);
                setTimeout(() => showMainApp(email), 600);
            }
        }

        function showMainApp(userDisplay) {
            document.getElementById('loginScreen')?.classList.add('hidden');
            document.getElementById('mainAppWrapper')?.classList.remove('hidden');
            const userStatus = document.getElementById('userAuthStatusText');
            if (userStatus) userStatus.innerText = userDisplay.split('@')[0];
            switchTab('homeTab');
        }

        function logoutUser() {
            appData.currentUserEmail = '';
            saveData();
            document.getElementById('mainAppWrapper')?.classList.add('hidden');
            document.getElementById('loginScreen')?.classList.remove('hidden');
            hideAuthNotice();
            const emailInput = document.getElementById('initEmailInput');
            const passInput = document.getElementById('initPasswordInput');
            if (emailInput) emailInput.value = '';
            if (passInput) passInput.value = '';
            // Reset state registrasi ke login biasa
            if (isInitRegister) toggleInitAuthMode();
        }

        function updateAllViews() {
            renderMuhasabahDosa();
            renderAmalSholeh();
            renderShalatTracker();
            renderQuote();
            updateDzikirUI();
            updateDashboardIndexes();
        }

        function initApp() {
            const datePicker = document.getElementById('datePicker');
            if (datePicker) {
                datePicker.value = currentDateStr;
                datePicker.addEventListener('change', (e) => {
                    currentDateStr = e.target.value;
                    updateAllViews();
                });
            }

            document.getElementById('prevDateBtn')?.addEventListener('click', () => {
                const d = new Date(currentDateStr);
                d.setDate(d.getDate() - 1);
                currentDateStr = d.toISOString().split('T')[0];
                if (datePicker) datePicker.value = currentDateStr;
                updateAllViews();
            });

            document.getElementById('nextDateBtn')?.addEventListener('click', () => {
                const d = new Date(currentDateStr);
                d.setDate(d.getDate() + 1);
                currentDateStr = d.toISOString().split('T')[0];
                if (datePicker) datePicker.value = currentDateStr;
                updateAllViews();
            });

            document.getElementById('todayBtn')?.addEventListener('click', () => {
                currentDateStr = new Date().toISOString().split('T')[0];
                if (datePicker) datePicker.value = currentDateStr;
                updateAllViews();
            });

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const tabId = btn.getAttribute('data-tab');
                    switchTab(tabId);
                });
            });

            document.getElementById('nextQuoteBtn')?.addEventListener('click', () => {
                currentQuoteIndex = (currentQuoteIndex + 1) % QUOTES_ULAMA.length;
                renderQuote();
            });

            document.getElementById('dzikirSelect')?.addEventListener('change', updateDzikirUI);

            document.getElementById('dzikirTapBtn')?.addEventListener('click', () => {
                const selectedKey = document.getElementById('dzikirSelect')?.value;
                if (!selectedKey) return;
                const today = getTodayData();
                today.dzikirCounts[selectedKey] = (today.dzikirCounts[selectedKey] || 0) + 1;
                saveData();
                updateDzikirUI();
            });

            document.getElementById('resetDzikirBtn')?.addEventListener('click', () => {
                const selectedKey = document.getElementById('dzikirSelect')?.value;
                if (!selectedKey) return;
                const today = getTodayData();
                today.dzikirCounts[selectedKey] = 0;
                saveData();
                updateDzikirUI();
            });

            const gdriveModal = document.getElementById('gdriveModal');
            document.getElementById('openGdriveModal')?.addEventListener('click', () => {
                const input = document.getElementById('gdriveClientIdInput');
                if (input) input.value = appData.gdriveClientId || '';
                gdriveModal?.classList.remove('hidden');
            });

            document.getElementById('closeGdriveModal')?.addEventListener('click', () => {
                gdriveModal?.classList.add('hidden');
            });

            document.getElementById('saveGdriveConfigBtn')?.addEventListener('click', () => {
                const input = document.getElementById('gdriveClientIdInput');
                if (input) {
                    appData.gdriveClientId = input.value.trim();
                    saveData();
                }
                gdriveModal?.classList.add('hidden');
                showAuthNotice('Konfigurasi Google Drive berhasil disimpan!', false);
            });

            document.getElementById('syncNowBtn')?.addEventListener('click', () => {
                saveData();
                showAuthNotice('Data berhasil disimpan secara lokal di browser Anda!', false);
                gdriveModal?.classList.add('hidden');
            });

            const amalModal = document.getElementById('amalModal');
            document.getElementById('addCustomAmalBtn')?.addEventListener('click', () => {
                amalModal?.classList.remove('hidden');
            });
            document.getElementById('closeAmalModal')?.addEventListener('click', () => {
                amalModal?.classList.add('hidden');
            });

            document.getElementById('saveNewAmalBtn')?.addEventListener('click', () => {
                const titleInput = document.getElementById('newAmalTitle');
                const categoryInput = document.getElementById('newAmalCategory');
                const title = titleInput ? titleInput.value.trim() : '';
                const category = categoryInput ? categoryInput.value : 'Ibadah';

                if (title) {
                    appData.customAmal.push({
                        id: 'custom_' + Date.now(),
                        label: title,
                        category: category
                    });
                    saveData();
                    renderAmalSholeh();
                    if (titleInput) titleInput.value = '';
                    amalModal?.classList.add('hidden');
                }
            });

            updateAllViews();
        }

        window.onload = function() {
            initApp();
            if (appData.currentUserEmail) {
                showMainApp(appData.currentUserEmail);
            }
        };
    </script>
</body>
</html>
